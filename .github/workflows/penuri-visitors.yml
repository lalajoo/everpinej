name: Refresh Penuri visitors
on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  pages: write
concurrency:
  group: penuri-visitors
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: projects/1039186996474/locations/global/workloadIdentityPools/penuri-visitors/providers/github
          service_account: penuri-visitors@penuri-everpinej.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
      - run: node --test tests/visitors.test.mjs
      - name: Read GA4 aggregate counts
        run: node scripts/refresh-visitors.mjs
        env:
          GA_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
      - name: Commit aggregate snapshot and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add penuri/data/visitors.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Penuri visitor totals'
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST repos/lalajoo/everpinej/pages/builds --silent
      - name: Verify published visitor snapshot
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { setTimeout } from 'node:timers/promises';
          const expected = JSON.parse(await readFile('penuri/data/visitors.json', 'utf8'));
          for (let attempt = 0; attempt < 40; attempt++) {
            try {
              const response = await fetch(`https://everpinej.com/penuri/data/visitors.json?updated=${encodeURIComponent(expected.updatedAt)}&attempt=${attempt}`, { signal: AbortSignal.timeout(10000) });
              const live = response.ok ? await response.json() : null;
              if (JSON.stringify(live) === JSON.stringify(expected)) { console.log('Published visitor snapshot verified'); process.exit(0); }
            } catch { /* Pages deployment or CDN propagation may still be in progress. */ }
            await setTimeout(5000);
          }
          throw new Error('Visitor snapshot was not published; inspect GitHub Pages deployment');
          JS
